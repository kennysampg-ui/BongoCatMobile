name: Build APK

# Compila o APK de teste na nuvem (os runners do GitHub já trazem o Android SDK).
# Rode em: aba Actions > "Build APK" > Run workflow. O APK fica em "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuração (assinado com a chave debug)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BongoCatMobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
