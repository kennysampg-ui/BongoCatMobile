<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bongo Cat Mobile</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Navegação principal"></nav>
  <main id="main">
    <section id="screen-home" class="screen" aria-label="Início"></section>
    <section id="screen-gallery" class="screen" aria-label="Galeria" hidden></section>
    <section id="screen-editor" class="screen" aria-label="Editor de personagens" hidden></section>
    <section id="screen-settings" class="screen" aria-label="Configurações" hidden></section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
<script src="js/engine.js"></script>
<script src="js/modes.js"></script>
<script src="js/characters.js"></script>
<script src="js/bridge.js"></script>
<script src="js/app.js"></script>
</body>
</html>
